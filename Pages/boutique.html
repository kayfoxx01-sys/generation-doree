<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Boutique — Boutique de Brandon</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="shop-page">


    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <!-- LOGO -->

            <a
                href="../index.html"
                class="logo"
            >
                BRANDON
            </a>


            <!-- NAVIGATION -->

            <nav class="navigation">

                <a href="../index.html">
                    Accueil
                </a>

                <a href="homme.html">
                    Homme
                </a>

                <a href="femme.html">
                    Femme
                </a>

                <a href="chaussures.html">
                    Chaussures
                </a>

                <a href="accessoires.html">
                    Accessoires
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <!-- ICONES -->

            <div class="nav-icons">


                <!-- FAVORIS -->

                <button
                    type="button"
                    class="icon-button"
                    aria-label="Favoris"
                >
                    ♡
                </button>


                <!-- PANIER -->

                <a
                    href="panier.html"
                    class="cart-icon"
                    aria-label="Panier"
                >
                    🛒
                </a>


                <!-- MENU -->

                <button
                    type="button"
                    class="icon-button menu-button"
                    aria-label="Menu"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>



    <!-- ==========================================
         BOUTIQUE
    =========================================== -->

    <main>

        <section class="shop-section">


            <div class="shop-container">


                <!-- ==================================
                     HEADER BOUTIQUE
                =================================== -->

                <div class="shop-header">

                    <span class="shop-label">
                        NOTRE BOUTIQUE
                    </span>

                    <h1>
                        Collection
                    </h1>

                    <p>
                        Découvrez prochainement notre sélection
                        de vêtements, chaussures et accessoires.
                    </p>

                </div>



                <!-- ==================================
                     GRILLE PRODUITS
                =================================== -->

                <div class="products-grid">


                    <!-- ==================================
                         PRODUIT — EMPLACEMENT 1
                    =================================== -->

                    <article class="product-card">


                        <!-- IMAGE -->

                        <div class="product-image">

                            <span class="product-placeholder">
                                PRODUIT
                            </span>

                        </div>


                        <!-- INFORMATIONS -->

                        <div class="product-info">

                            <span class="product-category">
                                CATÉGORIE
                            </span>

                            <h2>
                                Produit
                            </h2>

                            <p>
                                Description du produit.
                            </p>


                            <!-- PRIX + BOUTON -->

                            <div class="product-bottom">


                                <div class="product-price">

                                    <small>
                                        Prix
                                    </small>

                                    <strong>
                                        —
                                    </strong>

                                </div>


                                <a
                                    href="#"
                                    class="product-button"
                                >

                                    <span>
                                        DÉCOUVRIR
                                    </span>

                                </a>


                            </div>

                        </div>

                    </article>


                </div>


            </div>

        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <p>
            © 2026 Boutique de Brandon — Tous droits réservés.
        </p>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/script.js"></script>


</body>

</html>
